<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splitpot — Protótipo</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0a; font-family: 'Inter', system-ui, sans-serif; color: #fff; overflow: hidden; height: 100%; }
  * { box-sizing: border-box; }
  #root { width: 100vw; height: 100vh; position: relative; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="screens-part1.jsx"></script>
<script type="text/babel" src="screens-part2.jsx"></script>
<script type="text/babel" src="screens-part3.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

const TWEAKS_DEFAULTS = /*EDITMODE-BEGIN*/{
  "feltHue": 148,
  "feltSaturation": 55,
  "feltLightness": 14,
  "goldHue": 42,
  "accentColor": "#d4a24a",
  "cornerRadius": 16,
  "displayFont": "Playfair Display",
  "showVignette": true,
  "layout": "canvas"
}/*EDITMODE-END*/;

function applyTweaks(t) {
  const r = document.documentElement;
  const feltDeep = `hsl(${t.feltHue}, ${t.feltSaturation}%, ${Math.max(4, t.feltLightness - 8)}%)`;
  const felt = `hsl(${t.feltHue}, ${t.feltSaturation}%, ${t.feltLightness}%)`;
  const feltLight = `hsl(${t.feltHue}, ${t.feltSaturation}%, ${t.feltLightness + 8}%)`;
  r.style.setProperty('--felt-deep', feltDeep);
  r.style.setProperty('--felt', felt);
  r.style.setProperty('--felt-light', feltLight);
  r.style.setProperty('--gold', t.accentColor);
  r.style.setProperty('--gold-bright', t.accentColor);
}

// ──────────────────────────────────────────────
// Phone wrapper — a single screen in a phone frame
// ──────────────────────────────────────────────
function PhoneScreen({ screen, onNav }) {
  const S = {
    login: ScreenLogin, onboarding: ScreenOnboarding, home: ScreenHome,
    create: ScreenCreate, qr: ScreenQR, join: ScreenJoin,
    live: ScreenLive, cashout: ScreenCashout, close: ScreenClose,
    pix: ScreenPix, history: ScreenHistory, detail: ScreenDetail,
  }[screen];
  return (
    <Phone>
      <S onNav={onNav}/>
    </Phone>
  );
}

// ──────────────────────────────────────────────
// Interactive single-phone mode
// ──────────────────────────────────────────────
function InteractiveMode() {
  const [screen, setScreen] = useState('login');
  const order = ['login', 'onboarding', 'home', 'create', 'qr', 'join', 'live', 'cashout', 'close', 'pix', 'history', 'detail'];
  return (
    <div style={{
      width: '100%', height: '100%',
      background: 'radial-gradient(ellipse at 50% 40%, #1a1a1a 0%, #050505 80%)',
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
      padding: 40, gap: 20, overflow: 'auto',
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
        <div style={{ color: '#d4a24a', fontFamily: 'Playfair Display', fontSize: 24, fontWeight: 700 }}>Splitpot</div>
        <div style={{ color: '#666', fontSize: 12 }}>Protótipo interativo · clique nos botões para navegar</div>
      </div>

      <div style={{ transform: 'scale(0.92)' }}>
        <PhoneScreen screen={screen} onNav={setScreen}/>
      </div>

      {/* Screen jumper */}
      <div style={{
        display: 'flex', flexWrap: 'wrap', gap: 6, maxWidth: 680, justifyContent: 'center',
        padding: 12, background: 'rgba(255,255,255,0.04)', borderRadius: 12,
      }}>
        {order.map(k => (
          <button key={k} onClick={() => setScreen(k)} style={{
            padding: '6px 12px', borderRadius: 6,
            background: screen === k ? '#d4a24a' : 'transparent',
            color: screen === k ? '#2a1d08' : '#aaa',
            border: '1px solid ' + (screen === k ? '#d4a24a' : 'rgba(255,255,255,0.1)'),
            fontSize: 11, fontFamily: 'Inter', fontWeight: 600, cursor: 'pointer',
            textTransform: 'capitalize',
          }}>{k}</button>
        ))}
      </div>
    </div>
  );
}

// ──────────────────────────────────────────────
// Canvas mode — all screens laid out
// ──────────────────────────────────────────────
const sections = [
  {
    id: 'auth',
    title: 'Auth & Onboarding',
    subtitle: 'Login Google/Apple + captura de nome, email e chave PIX',
    screens: [
      { id: 'login', label: '1 · Login', screen: 'login' },
      { id: 'onboarding', label: '2 · Onboarding · perfil', screen: 'onboarding' },
    ],
  },
  {
    id: 'home',
    title: 'Home & Criar mesa',
    subtitle: 'Hub principal do host: criar mesa, definir buy-in e gerar QR',
    screens: [
      { id: 'home', label: '3 · Home · hub', screen: 'home' },
      { id: 'create', label: '4 · Criar mesa', screen: 'create' },
      { id: 'qr', label: '5 · QR Code · convidar', screen: 'qr' },
    ],
  },
  {
    id: 'player',
    title: 'Fluxo do Jogador',
    subtitle: 'O convidado escaneia o QR, escolhe o buy-in e entra',
    screens: [
      { id: 'join', label: '6 · Entrar na mesa', screen: 'join' },
      { id: 'live', label: '7 · Mesa ao vivo', screen: 'live' },
      { id: 'cashout', label: '8 · Cash out', screen: 'cashout' },
    ],
  },
  {
    id: 'settle',
    title: 'Fechamento & Acertos PIX',
    subtitle: 'Host revê P&L, algoritmo otimiza transferências, confirma status',
    screens: [
      { id: 'close', label: '9 · Fechar mesa · revisão', screen: 'close' },
      { id: 'pix', label: '10 · Status dos PIX', screen: 'pix' },
    ],
  },
  {
    id: 'history',
    title: 'Histórico & Detalhes',
    subtitle: 'Mesas passadas por email + estatísticas + drill-down',
    screens: [
      { id: 'history', label: '11 · Histórico de mesas', screen: 'history' },
      { id: 'detail', label: '12 · Detalhe de mesa passada', screen: 'detail' },
    ],
  },
];

function CanvasMode({ onScreen }) {
  return (
    <DesignCanvas>
      {sections.map(sec => (
        <DCSection key={sec.id} id={sec.id} title={sec.title} subtitle={sec.subtitle}>
          {sec.screens.map(s => (
            <DCArtboard key={s.id} id={s.id} label={s.label} width={390} height={780}>
              <PhoneScreen screen={s.screen} onNav={onScreen}/>
            </DCArtboard>
          ))}
        </DCSection>
      ))}
    </DesignCanvas>
  );
}

// ──────────────────────────────────────────────
// App
// ──────────────────────────────────────────────
function App() {
  const [tweaks, setTweaks] = useTweaks(TWEAKS_DEFAULTS);
  const [focusScreen, setFocusScreen] = useState(null);

  useEffect(() => { applyTweaks(tweaks); }, [tweaks]);

  const mode = tweaks.layout || 'canvas';

  // When in canvas mode and user taps a button inside a phone, open focus
  const handleScreenNav = (s) => setFocusScreen(s);

  return (
    <>
      {mode === 'interactive' ? <InteractiveMode/> : <CanvasMode onScreen={handleScreenNav}/>}

      {/* Focus overlay (triggered from canvas phones) */}
      {focusScreen && (
        <div onClick={() => setFocusScreen(null)} style={{
          position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.85)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          zIndex: 200, backdropFilter: 'blur(8px)',
        }}>
          <div onClick={e => e.stopPropagation()} style={{ transform: 'scale(1)' }}>
            <PhoneScreen screen={focusScreen} onNav={setFocusScreen}/>
          </div>
          <button onClick={() => setFocusScreen(null)} style={{
            position: 'fixed', top: 20, right: 20,
            width: 40, height: 40, borderRadius: 20,
            background: 'rgba(255,255,255,0.1)', border: '1px solid rgba(255,255,255,0.2)',
            color: '#fff', fontSize: 18, cursor: 'pointer',
          }}>×</button>
        </div>
      )}

      {/* Tweaks panel */}
      <TweaksPanel title="Tweaks · Splitpot">
        <TweakSection title="Modo de visualização">
          <TweakRadio label="Layout" value={tweaks.layout}
            onChange={v => setTweaks({ layout: v })}
            options={[
              { value: 'canvas', label: 'Canvas (todas as telas)' },
              { value: 'interactive', label: 'Interativo (1 tela)' },
            ]}/>
        </TweakSection>

        <TweakSection title="Cores do feltro">
          <TweakSlider label="Matiz (hue)" value={tweaks.feltHue} onChange={v => setTweaks({ feltHue: v })} min={0} max={360} step={1}/>
          <TweakSlider label="Saturação" value={tweaks.feltSaturation} onChange={v => setTweaks({ feltSaturation: v })} min={0} max={100} step={1}/>
          <TweakSlider label="Luminosidade" value={tweaks.feltLightness} onChange={v => setTweaks({ feltLightness: v })} min={4} max={40} step={1}/>
          <div style={{ display: 'flex', gap: 6, marginTop: 6, flexWrap: 'wrap' }}>
            {[
              { name: 'Clássico', h: 148, s: 55, l: 14 },
              { name: 'Esmeralda', h: 160, s: 70, l: 18 },
              { name: 'Bordô', h: 350, s: 45, l: 16 },
              { name: 'Índigo', h: 235, s: 55, l: 16 },
              { name: 'Meia-noite', h: 215, s: 30, l: 9 },
            ].map(p => (
              <button key={p.name} onClick={() => setTweaks({ feltHue: p.h, feltSaturation: p.s, feltLightness: p.l })} style={{
                padding: '6px 10px', borderRadius: 6, fontSize: 11,
                background: `hsl(${p.h}, ${p.s}%, ${p.l}%)`,
                border: '1px solid rgba(255,255,255,0.2)',
                color: '#fff', cursor: 'pointer',
              }}>{p.name}</button>
            ))}
          </div>
        </TweakSection>

        <TweakSection title="Acento (dourado)">
          <TweakColor label="Cor do acento" value={tweaks.accentColor} onChange={v => setTweaks({ accentColor: v })}/>
          <div style={{ display: 'flex', gap: 6, marginTop: 6, flexWrap: 'wrap' }}>
            {['#d4a24a', '#f0c770', '#e5a3b7', '#a8c4d4', '#c0a4f0', '#e8e3d5'].map(c => (
              <button key={c} onClick={() => setTweaks({ accentColor: c })} style={{
                width: 24, height: 24, borderRadius: 6, background: c,
                border: '1px solid rgba(255,255,255,0.2)', cursor: 'pointer',
              }}/>
            ))}
          </div>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
