name: Deploy Web → Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'app/**'
      - 'firebase.json'
      - 'scripts/build-hosting.sh'
      - '.github/workflows/deploy-web.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build hosting bundle (site na raiz + PWA em /app)
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: bash scripts/build-hosting.sh

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPLITPOT_4338D }}
          channelId: live
          projectId: splitpot-4338d
          target: splitpot-4338d
