<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Controle de buy-ins e acertos para home games de poker. Simples, rápido e sem planilha.">
  <meta name="theme-color" content="#0A2518">

  <!-- Open Graph / WhatsApp / iMessage -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SplitPot">
  <meta property="og:title" content="SplitPot — acertos de poker sem drama">
  <meta property="og:description" content="Controle de buy-ins e acertos para home games de poker. Simples, rápido e sem planilha.">
  <meta property="og:image" content="https://splitpot.com.br/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:url" content="https://splitpot.com.br">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="SplitPot — acertos de poker sem drama">
  <meta name="twitter:description" content="Controle de buy-ins e acertos para home games de poker.">
  <meta name="twitter:image" content="https://splitpot.com.br/icons/Icon-512.png">

  <!-- Google Sign-In (web) — obrigatório para google_sign_in 7.x.
       Clientid idêntico ao AppConfig.googleClientId (dart-define GOOGLE_CLIENT_ID). -->
  <meta name="google-signin-client_id" content="986946226655-4pn2a151tjin4bcpi9qfhsb835g9mj8g.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="splitpot">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>splitpot</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #0a2518;
    }

    #sp-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 0%, #155a36 0%, #0f3a24 40%, #0a2518 100%);
      z-index: 9999;
      transition: opacity 0.45s ease;
    }

    #sp-splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .sp-splash-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      animation: sp-fade-scale-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .sp-splash-logo img {
      width: 46px;
      height: 46px;
    }

    .sp-splash-logo span {
      font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #f0c770;
    }

    @keyframes sp-fade-scale-in {
      from { opacity: 0; transform: scale(0.82); }
      to   { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="sp-splash">
    <div class="sp-splash-logo">
 
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('sp-splash');
      if (!splash) return;
      splash.classList.add('hidden');
      setTimeout(function () { splash.remove(); }, 500);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
